name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/chatbot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/chatbot/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm test -- --watch=false

  rag-artifacts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rag } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: rag/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m unittest test_production_index.py

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tan-backend ./backend
      - run: docker build -t tan-frontend ./frontend/chatbot
      - run: docker build -t tan-rag ./rag
